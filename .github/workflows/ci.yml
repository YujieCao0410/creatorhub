name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: creatorhub
          POSTGRES_PASSWORD: creatorhub
          POSTGRES_DB: creatorhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U creatorhub"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: "postgresql://creatorhub:creatorhub@localhost:5432/creatorhub?schema=public"
      TEST_DATABASE_URL: "postgresql://creatorhub:creatorhub@localhost:5432/creatorhub?schema=public"
      JWT_SECRET: "ci-secret-that-is-at-least-thirty-two-characters"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: creatorhub
          POSTGRES_PASSWORD: creatorhub
          POSTGRES_DB: creatorhub_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U creatorhub"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_DATABASE_URL: "postgresql://creatorhub:creatorhub@localhost:5432/creatorhub_e2e?schema=public"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "true"
