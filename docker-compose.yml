# Local PostgreSQL for development. CreatorHub uses Postgres in every
# environment.
#
#   docker compose up -d
#   # .env: DATABASE_URL from .env.example
#   npm run db:deploy
#
# The test suites use their own databases on this instance — create them once:
#   docker compose exec -T db psql -U creatorhub -c "CREATE DATABASE creatorhub_test;"
#   docker compose exec -T db psql -U creatorhub -c "CREATE DATABASE creatorhub_e2e;"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: creatorhub
      POSTGRES_PASSWORD: creatorhub
      POSTGRES_DB: creatorhub
    ports:
      - "5432:5432"
    volumes:
      - creatorhub_pgdata:/var/lib/postgresql/data

volumes:
  creatorhub_pgdata:
